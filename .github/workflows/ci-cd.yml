name: Lens Web CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build workspace
        run: pnpm build
        env:
          VITE_BACKEND_API_URL: http://localhost:3000
          VITE_API_URL: http://localhost:3000
          VITE_API_MOCKING: disabled
          VITE_PORTAL_URL: http://localhost:5174
          VITE_LANDING_URL: http://localhost:5173
          VITE_ADMIN_URL: http://localhost:5175

  publish:
    name: Publish ${{ matrix.app }} image
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: quality
    runs-on: ubuntu-latest
    environment: Deploy-FE
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - landing
          - portal
          - admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Validate deployment variables
        env:
          VITE_BACKEND_API_URL: ${{ secrets.VITE_BACKEND_API_URL }}
          VITE_LANDING_URL: ${{ secrets.VITE_LANDING_URL }}
          VITE_PORTAL_URL: ${{ secrets.VITE_PORTAL_URL }}
          VITE_ADMIN_URL: ${{ secrets.VITE_ADMIN_URL }}
        run: |
          test -n "$VITE_BACKEND_API_URL" || { echo "Set VITE_BACKEND_API_URL in the Deploy-FE environment secrets" >&2; exit 1; }
          test -n "$VITE_LANDING_URL" || { echo "Set VITE_LANDING_URL in the Deploy-FE environment secrets" >&2; exit 1; }
          test -n "$VITE_PORTAL_URL" || { echo "Set VITE_PORTAL_URL in the Deploy-FE environment secrets" >&2; exit 1; }
          test -n "$VITE_ADMIN_URL" || { echo "Set VITE_ADMIN_URL in the Deploy-FE environment secrets" >&2; exit 1; }
          for url in "$VITE_BACKEND_API_URL" "$VITE_LANDING_URL" "$VITE_PORTAL_URL" "$VITE_ADMIN_URL"; do
            case "$url" in
              http://*|https://*) ;;
              *) echo "Frontend URLs must start with http:// or https://" >&2; exit 1 ;;
            esac
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/lens-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
            VITE_BACKEND_API_URL=${{ secrets.VITE_BACKEND_API_URL }}
            VITE_API_URL=${{ secrets.VITE_API_URL || secrets.VITE_BACKEND_API_URL }}
            VITE_API_MOCKING=${{ secrets.VITE_API_MOCKING || 'disabled' }}
            VITE_PORTAL_URL=${{ secrets.VITE_PORTAL_URL }}
            VITE_LANDING_URL=${{ secrets.VITE_LANDING_URL }}
            VITE_ADMIN_URL=${{ secrets.VITE_ADMIN_URL }}
          cache-from: type=gha,scope=frontend-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.app }}
